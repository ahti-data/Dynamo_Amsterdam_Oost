# Productieconfiguratie Dynamo/ahti demografische monitor (statische SPA)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Toegangsbeveiliging: NIET via de server. De data zelf is versleuteld (zie
    # deploy/encrypt_data.py) en de app vraagt in de browser om het wachtwoord.
    # Zo lekt de data niet, ook niet bij directe download van de .enc-bestanden.

    # gzip voor tekstformaten (geojson/json zijn de grootste assets)
    gzip on;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;
    gzip_min_length 1024;

    # content-hashed assets uit de Vite-build mogen lang gecachet worden
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # databundels wisselen per CBS-jaargang: kort cachen, altijd hervalideren
    location /data/ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;

    # healthcheck voor loadbalancer/monitoring
    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
