name: Deploy Dynamo monitor via SFTP

# Adapted from dashboard/.github/workflows/deploy.yml. The Dynamo monitor is a
# Vite SPA (not a Shiny app), so we build it first and upload the built dist/.
#
# Two long-lived branches map to two folders on the server:
#   main_dev  -> /apps/dynamo/       (internal/dev copy)
#   main_prod -> /apps/dynamo_prod/  (client-facing copy)
on:
  push:
    branches:
      - main_dev
      - main_prod
    paths:
      - 'dashboard_client/**'
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Deploy Dynamo
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: dashboard_client/dashboard/package-lock.json

    - name: 📦 Install dependencies
      working-directory: dashboard_client/dashboard
      run: npm ci

    - name: 🏗️ Build
      working-directory: dashboard_client/dashboard
      run: npm run build

    - name: 🎯 Pick remote folder for this branch
      id: target
      run: |
        if [ "${{ github.ref_name }}" = "main_prod" ]; then
          echo "remote_path=/apps/dynamo_prod/" >> "$GITHUB_OUTPUT"
        else
          echo "remote_path=/apps/dynamo/" >> "$GITHUB_OUTPUT"
        fi

    - name: 📂 Sync files via SFTP
      uses: wlixcc/SFTP-Deploy-Action@v1.2.4
      with:
        username: ${{ secrets.FTP_USERNAME }}
        server: ${{ secrets.FTP_SERVER }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 22
        local_path: './dashboard_client/dashboard/dist/*'
        remote_path: ${{ steps.target.outputs.remote_path }}
        sftp_only: true
        delete_remote_files: false
